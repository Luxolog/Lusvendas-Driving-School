<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lusvendas Demo Quiz</title><style>body{font:16px system-ui;background:#f5f8f5;color:#14231b;margin:0}header{background:#111111;color:white;padding:16px 5vw;border-bottom:4px solid #d71920;font-weight:900}main{max-width:860px;margin:28px auto;padding:0 17px 55px}.banner{background:#fff4f2;border:2px solid #d71920;border-radius:11px;padding:9px 13px;font-weight:900;color:#83242a;text-align:center;font-size:.77rem}.panel{background:white;border:1px solid #e1e9e2;border-radius:18px;padding:clamp(18px,4vw,32px);margin-top:16px}.eyebrow{color:#d71920;font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.74rem}.muted{color:#607168}.field{display:grid;gap:6px;margin:18px 0}.field input{max-width:430px;width:100%;padding:12px;border:1px solid #b9c8bd;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 16px;background:#d71920;color:white;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#edf3ef;color:#a51219}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.progress{height:9px;background:#e5ece6;border-radius:10px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:#d71920}.question{font-size:1.2rem;font-weight:850;margin:22px 0}.options{display:grid;gap:10px}.option{display:flex;gap:12px;text-align:left;align-items:center;padding:13px;border:1px solid #e1e9e2;border-radius:12px;background:#fff;color:#14231b;font:inherit;cursor:pointer}.option:hover,.option.chosen{border-color:#d71920;background:#fff0f0}.letter{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#eff3ef;font-weight:850;flex:none}.meta{font-size:.8rem;color:#607168;text-transform:capitalize}.score{font-size:2.5rem;font-weight:950;color:#d71920}.review{border:1px solid #e1e9e2;border-radius:12px;padding:15px;margin:12px 0}.review p{margin:6px 0}.right{color:#a51219}.wrong{color:#a51f28}.empty{padding:14px;background:#fff5df;border-radius:10px;color:#684b12}img.diagram{display:block;max-width:min(100%,480px);max-height:260px;object-fit:contain;margin:12px auto;padding:6px;background:#fff;border:1px solid #e1e9e2;border-radius:10px}@media(max-width:560px){main{margin:18px auto}.actions{display:grid}.actions .btn{width:100%}.question{font-size:1.08rem}}</style></head><body><header><img src="../assets/lusvendas-logo.svg" alt="Lusvendas General Project and Services" style="width:145px;height:52px;object-fit:contain;background:#fff;border-radius:6px;vertical-align:middle"> &nbsp; DRIVING SCHOOL</header><main><div class="banner">DEMO ENVIRONMENT · 10 SAMPLE QUESTIONS ONLY</div><section id="app" class="panel"><p>Loading demo questions…</p></section></main><footer style="text-align:center;padding:22px;color:#607168;font-size:.78rem">Limited demonstration · Ekhaya Technologies</footer><script>
"use strict";const app=document.getElementById("app");let bank=[],questions=[],answers={},index=0,learner="";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
function start(){app.innerHTML='<div class="eyebrow">Sample assessment</div><h1>Welcome to the Lusvendas demo</h1><p class="muted">Enter a name or demo learner ID, then try 10 sample questions. No registration or personal data is sent to the school.</p><div class="field"><label for="learner">Demo learner name or ID</label><input id="learner" maxlength="40" autocomplete="off" placeholder="e.g. Demo Learner"></div><div class="empty">This is a demonstration only. It contains 10 sample questions and is not a complete K53 preparation course or official examination.</div><div class="actions"><button class="btn" id="begin">Start demo quiz</button><a class="btn secondary" href="./index.html">Back</a></div>';document.getElementById("begin").onclick=()=>{learner=document.getElementById("learner").value.trim()||"Demo Learner";questions=shuffle(bank.test1).map(q=>{const opts=shuffle(q.options.map((label,i)=>({label,correct:i===q.correctIndex})));return {...q,options:opts,correctIndex:opts.findIndex(o=>o.correct)}});answers={};index=0;render()}}
function render(){const q=questions[index];app.innerHTML='<strong>Question '+(index+1)+' of 10</strong><span class="meta"> · '+esc(q.category||"K53")+'</span><div class="progress"><span style="width:'+(index/10*100)+'%"></span></div><div class="question"></div><div class="diagrams"></div><div class="options"></div><div class="actions"><button class="btn secondary" id="previous" '+(index===0?"disabled":"")+'>Previous</button><button class="btn" id="next">'+(index===9?"Finish demo":"Next question")+'</button></div><p class="muted">'+Object.keys(answers).length+' of 10 answered</p>';app.querySelector(".question").textContent=q.question;(q.diagramImages||[]).forEach(url=>{const img=document.createElement("img");img.className="diagram";img.src=url.replace(/^\.\.\//,"../");img.alt="Question diagram";img.onerror=()=>img.remove();app.querySelector(".diagrams").append(img)});q.options.forEach((o,i)=>{const b=document.createElement("button");b.className="option"+(answers[index]===i?" chosen":"");b.type="button";b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(o.label)+'</span>';b.onclick=()=>{answers[index]=i;render()};app.querySelector(".options").append(b)});document.getElementById("previous").onclick=()=>{index--;render()};document.getElementById("next").onclick=()=>{if(answers[index]===undefined){const m=document.createElement("p");m.className="empty";m.textContent="Choose an answer before continuing.";app.prepend(m);return}if(index<9){index++;render()}else finish()}}
function finish(){let score=0;questions.forEach((q,i)=>{if(answers[i]===q.correctIndex)score++});app.innerHTML='<div class="eyebrow">Demo completed</div><h1>Thank you, '+esc(learner)+'</h1><div class="score">'+score+' / 10</div><p><strong>'+Math.round(score/10*100)+'%</strong> sample score</p><p class="muted">This result is only for the current demonstration and has not been sent to Lusvendas Driving School.</p><h2>Answer review</h2><div id="review"></div><div class="actions"><button class="btn" id="retry">Try demo again</button><a class="btn secondary" href="../index.html">Back to home</a><a class="btn secondary" href="../owner-dashboard.html">Owner dashboard</a></div>';questions.forEach((q,i)=>{const r=document.createElement("article");r.className="review";r.innerHTML='<strong>Question '+(i+1)+'</strong><p>'+esc(q.question)+'</p><p class="'+(answers[i]===q.correctIndex?"right":"wrong")+'"><b>Your answer:</b> '+esc(q.options[answers[i]]?.label)+'</p><p class="right"><b>Correct answer:</b> '+esc(q.options[q.correctIndex]?.label)+'</p>';document.getElementById("review").append(r)});document.getElementById("retry").onclick=start}
fetch("questions.json").then(r=>{if(!r.ok)throw Error("Unable to load demo question bank");return r.json()}).then(data=>{bank=data;if(!Array.isArray(bank.test1)||bank.test1.length!==10)throw Error("Demo question bank must contain exactly 10 questions");start()}).catch(e=>{app.innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
</script></body></html>
